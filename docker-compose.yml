
services:
  # ── PostgreSQL 15 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: flyy_postgres
    environment:
      POSTGRES_USER: flyy
      POSTGRES_PASSWORD: flyy_secret
      POSTGRES_DB: flyy_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyy -d flyy_db"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flyy_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://flyy:flyy_secret@postgres:5432/flyy_db
      SYNC_DATABASE_URL: postgresql://flyy:flyy_secret@postgres:5432/flyy_db
      OTEL_SERVICE_NAME: flyy-backend
      RETENTION_CHECK_INTERVAL_HOURS: 1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Seed data (runs once after backend is healthy) ───────────────────────────
  seeder:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flyy_seeder
    command: python seed_data.py
    environment:
      DATABASE_URL: postgresql+asyncpg://flyy:flyy_secret@postgres:5432/flyy_db
      SYNC_DATABASE_URL: postgresql://flyy:flyy_secret@postgres:5432/flyy_db
      OTEL_SERVICE_NAME: flyy-seeder
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

  # ── React Frontend (nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flyy_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
